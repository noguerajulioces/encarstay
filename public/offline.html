<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#faf8f5">
    <title>Sin conexión · Encar Stays</title>
    <style>
      :root { color-scheme: light; font-family: "Outfit", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #faf8f5;
        color: #332f2b;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      main { max-width: 420px; }
      img { border-radius: 24px; height: 88px; width: 88px; }
      h1 { font-size: 1.75rem; margin: 24px 0 12px; }
      p { color: #6f675f; line-height: 1.6; margin: 0 0 24px; }
      button {
        background: #332f2b;
        border: 0;
        border-radius: 999px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 12px 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="">
      <h1>Estás sin conexión</h1>
      <p>Comprueba tu conexión a internet y vuelve a intentarlo para continuar con Encar Stays.</p>
      <button type="button" onclick="window.location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
