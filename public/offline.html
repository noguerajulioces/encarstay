<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#faf8f5">
    <title>Sin conexión — Encar Stays</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/errors.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Ir al inicio de Encar Stays">
        <img class="brand__mark" src="/icon-192.png" alt="" width="41" height="41">
        <span>Encar Stays</span>
      </a>
    </header>

    <main class="error-page">
      <div class="error-layout">
        <section class="error-copy" aria-labelledby="error-title">
          <p class="eyebrow">Sin conexión</p>
          <h1 id="error-title">Parece que te quedaste sin señal.</h1>
          <p class="description">Revisá tu conexión a internet. Cuando vuelvas a estar en línea, podés continuar explorando desde donde estabas.</p>
          <div class="actions">
            <a class="button" href="">Comprobar conexión</a>
            <a class="text-link" href="/">Ir al inicio</a>
          </div>
        </section>

        <div class="scene" aria-hidden="true">
          <span class="sun"></span>
          <span class="shadow-card"></span>
          <div class="room-key">
            <span class="room-key__brand">Encar Stays · Paraguay</span>
            <strong class="room-key__code">OFF</strong>
            <span class="room-key__line"></span>
            <span class="room-key__note"><span>Sin señal</span><span>Te esperamos</span></span>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">Una estadía más simple, cerca de todo.</footer>
  </body>
</html>
